name: OpenForge Scheduler
# Ticks every 30 minutes and dispatches any scheduled missions that are
# due (state lives in .openforge/schedule.json). Also dispatchable by hand,
# optionally with force_id to run one entry immediately. Runs created via
# workflow_dispatch are exempt from GitHub's "GITHUB_TOKEN events don't
# trigger runs" rule, which is what makes scheduler->agent dispatch work
# with the built-in token — no extra secrets needed.
#
# FIX (2026-10-22): the tick also runs one organism lifecycle cycle per
# scheduler.mjs, which persists to .openforge/organism.json. The previous
# commit step only staged schedule.json, so the organism's state was
# discarded with the ephemeral runner every tick (every cycle was
# "first awakening": no cycle memory, no proposals, no directives, and
# the Organism panel always reported "no state yet"). This step now
# stages both files in the same commit.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_id:
        description: 'Schedule entry id to run now (optional)'
        required: false
        type: string
run-name: OpenForge Scheduler tick
permissions:
  contents: write
  actions: write
concurrency:
  group: openforge-scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Learning digest (what the router currently believes)
        run: |
          if [ -f .openforge/model-stats.json ]; then
            node -e "const s=require('./.openforge/model-stats.json'); const arms=Object.entries(s.arms||{}); if(!arms.length){console.log('No model statistics yet — the router is still exploring.')} else {const byClass={}; for(const [k,v] of arms){const [m,c]=k.split('|'); (byClass[c]??=[]).push([m,v]);} for(const [c,list] of Object.entries(byClass)){list.sort((a,b)=>(b[1].ok/Math.max(b[1].pulls,1))-(a[1].ok/Math.max(a[1].pulls,1))); console.log('Task class '+c+': '+list.slice(0,3).map(([m,v])=>m+' ('+v.ok+'/'+v.pulls+' ok)').join(' · '));}}"
          else
            echo "No model statistics yet — the router is still exploring."
          fi
          if [ -f .openforge/skills/index.json ]; then
            echo "Skill library: $(node -e "console.log(require('./.openforge/skills/index.json').skills.length)") skills"
          fi
      - name: Dispatch due missions
        env:
          SCHEDULER_REF: main
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.force_id }}" ]; then
            node agent/scheduler.mjs --force "${{ inputs.force_id }}"
          else
            node agent/scheduler.mjs
          fi
      - name: Commit schedule + organism state
        run: |
          git config user.name "OpenForge Scheduler"
          git config user.email "scheduler@openforge.local"
          git add .openforge/schedule.json
          # Organism state is written fresh every tick; stage it when present
          # (untracked on the first tick, so plain `git diff` would miss it).
          if [ -f .openforge/organism.json ]; then git add .openforge/organism.json; fi
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "[openforge-scheduler] state update"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
