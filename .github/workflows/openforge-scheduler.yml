name: OpenForge Scheduler
# Ticks every 30 minutes and dispatches any scheduled missions that are
# due (state lives in .openforge/schedule.json). Also dispatchable by hand,
# optionally with force_id to run one entry immediately. Runs created via
# workflow_dispatch are exempt from GitHub's "GITHUB_TOKEN events don't
# trigger runs" rule, which is what makes scheduler->agent dispatch work
# with the built-in token — no extra secrets needed.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_id:
        description: 'Schedule entry id to run now (optional)'
        required: false
        type: string
run-name: OpenForge Scheduler tick
permissions:
  contents: write
  actions: write
concurrency:
  group: openforge-scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Learning digest (what the router currently believes)
        run: |
          if [ -f .openforge/model-stats.json ]; then
            node -e "const s=require('./.openforge/model-stats.json'); const arms=Object.entries(s.arms||{}); if(!arms.length){console.log('No model statistics yet — the router is still exploring.')} else {const byClass={}; for(const [k,v] of arms){const [m,c]=k.split('|'); (byClass[c]??=[]).push([m,v]);} for(const [c,list] of Object.entries(byClass)){list.sort((a,b)=>(b[1].ok/Math.max(b[1].pulls,1))-(a[1].ok/Math.max(a[1].pulls,1))); console.log('Task class '+c+': '+list.slice(0,3).map(([m,v])=>m+' ('+v.ok+'/'+v.pulls+' ok)').join(' · '));}}"
          else
            echo "No model statistics yet — the router is still exploring."
          fi
          if [ -f .openforge/skills/index.json ]; then
            echo "Skill library: $(node -e "console.log(require('./.openforge/skills/index.json').skills.length)") skills"
          fi
      - name: Dispatch due missions
        env:
          SCHEDULER_REF: main
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.force_id }}" ]; then
            node agent/scheduler.mjs --force "${{ inputs.force_id }}"
          else
            node agent/scheduler.mjs
          fi
      # Scheduler + organism state, conflict-safe (2026-10-24 widening,
      # supersedes the 2026-10-22 organism.json-only fix): the tick
      # writes ONLY organism-owned paths — .openforge/organism.json and
      # .openforge/organism/ (directives + immutable replication files) —
      # plus schedule.json. It never touches model-stats.json or the
      # shared skill library, so a tick and a mission merge can never
      # collide on a shared file. The commit is gated on the staged diff
      # across ALL of those paths (the old step only looked at
      # schedule.json, so a tick that changed only organism state
      # committed nothing). If main advanced during the tick and the
      # rebase conflicts on organism.json, the conflict is resolved by
      # merge, not by picking a side: node agent/organism.mjs
      # merge-state unions proposals, history, and replications.
      # Any other conflict aborts visibly instead of silently dropping
      # the tick's state.
      - name: Commit scheduler + organism state
        run: |
          git config user.name "OpenForge Scheduler"
          git config user.email "scheduler@openforge.local"
          if [ -f .openforge/schedule.json ]; then git add .openforge/schedule.json; fi
          if [ -f .openforge/organism.json ]; then git add .openforge/organism.json; fi
          if [ -d .openforge/organism ]; then git add .openforge/organism; fi
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "[openforge-scheduler] state update"
          if git pull --rebase origin main; then
            git push origin HEAD:main
            exit 0
          fi
          echo "Rebase conflict — resolving organism state by merge..."
          for file in $(git diff --name-only --diff-filter=U); do
            case "$file" in
              .openforge/organism.json)
                git show :2:"$file" > /tmp/organism-ours.json
                git show :3:"$file" > /tmp/organism-theirs.json
                node agent/organism.mjs merge-state /tmp/organism-ours.json /tmp/organism-theirs.json "$file"
                git add "$file"
                ;;
              .openforge/organism/*)
                git checkout --theirs -- "$file" || true
                git add "$file" || true
                ;;
              *)
                echo "Unresolvable conflict in $file — aborting so state is not silently dropped."
                git rebase --abort || true
                exit 1
                ;;
            esac
          done
          GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          git push origin HEAD:main
