# OpenForge Android — build (Gradle), export .apk/.aab, optional
# Play Store upload, optional BrowserStack App Live upload.
#
# Two pipelines:
#   sparkfabrik — sparkfabrik/android-build-action (fastlane-driven):
#                 fastest path for debug APKs and signed AAB -> Play.
#   gradle      — the ProAndroidDev recipe, modernized: checkout,
#                 JDK 17, Android SDK, keystore decoded from secrets,
#                 signing via SIGNING_* env vars in build.gradle,
#                 artifacts + r0adkll Play upload + BrowserStack API.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY_STORE_BASE64   base64 of your keystore (.jks)
#   SIGNING_STORE_PASSWORD     keystore password
#   SIGNING_KEY_ALIAS          key alias
#   SIGNING_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account JSON (one line)
#   BROWSERSTACK_USERNAME      BrowserStack username
#   BROWSERSTACK_ACCESS_KEY    BrowserStack access key
#
# Debug builds need no secrets at all.

name: OpenForge Android

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Build pipeline
        type: choice
        options: [sparkfabrik, gradle, dagger]
        default: sparkfabrik
      project_path:
        description: Android project folder (where gradlew lives; '.' = repo root)
        type: string
        default: '.'
      build_type:
        description: What to build
        type: choice
        options: [debug-apk, release-apk, release-aab]
        default: debug-apk
      package_name:
        description: Android package name (needed for Play uploads)
        type: string
        default: ''
      upload_play:
        description: Upload to Google Play after building
        type: boolean
        default: false
      play_track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      upload_browserstack:
        description: Upload to BrowserStack App Live after building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sparkfabrik:
    name: Build (sparkfabrik + fastlane)
    if: inputs.pipeline == 'sparkfabrik'
    runs-on: ubuntu-latest
    env:
      OUTPUT_FILE: ${{ inputs.build_type == 'release-aab' && 'openforge-app.aab' || 'openforge-app.apk' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Gradle (for the wrapper bootstrap)
        uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper (if the project has none)
        working-directory: ${{ inputs.project_path }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No gradle-wrapper.jar (generated projects omit the binary) — generating the wrapper with the runner's Gradle."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true
      - name: Build Android app
        uses: sparkfabrik/android-build-action@v1.5.0
        with:
          project-path: ${{ inputs.project_path }}
          build-type: ${{ inputs.build_type == 'release-aab' && 'bundle' || 'assemble' }}
          gradle-task: ${{ inputs.build_type == 'release-aab' && 'bundleRelease' || inputs.build_type == 'release-apk' && 'assembleRelease' || 'assembleDebug' }}
          output-path: ${{ env.OUTPUT_FILE }}
          package-name: ${{ inputs.package_name }}
          keystore-content: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          keystore-password: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keystore-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          upload-to-play-store: ${{ inputs.upload_play }}
          json-key-data: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          release-track: ${{ inputs.play_track }}
          release-status: draft
          browserstack-upload: ${{ inputs.upload_browserstack }}
          browserstack-username: ${{ secrets.BROWSERSTACK_USERNAME }}
          browserstack-access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}
          path: ${{ env.OUTPUT_FILE }}
          if-no-files-found: warn

  gradle:
    name: Build (Gradle, env-signed)
    if: inputs.pipeline == 'gradle'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project_path }}
    env:
      GRADLE_TASK: ${{ inputs.build_type == 'release-aab' && 'bundleRelease' || inputs.build_type == 'release-apk' && 'assembleRelease' || 'assembleDebug' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper (if the project has none)
        working-directory: ${{ inputs.project_path }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No gradle-wrapper.jar (generated projects omit the binary) — generating the wrapper with the runner's Gradle."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true
      - name: Decode keystore
        if: inputs.build_type != 'debug-apk'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release builds need the SIGNING_KEY_STORE_BASE64 secret (base64 of your keystore)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/${{ inputs.project_path }}/keystore.jks"
          echo "Keystore decoded."
      - name: Build with Gradle
        env:
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/${{ inputs.project_path }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew ${{ env.GRADLE_TASK }} --stacktrace
      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Locate build output
        id: locate
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.build_type }}" = "release-aab" ]; then
            FILE=$(find . -path ./node_modules -prune -o -name '*.aab' -print | head -1)
          else
            FILE=$(find . -path ./node_modules -prune -o -name '*.apk' -print | head -1)
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Located: $FILE"
      - name: Upload to Google Play
        if: inputs.upload_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ steps.locate.outputs.file }}
          track: ${{ inputs.play_track }}
          status: draft
      - name: Upload to BrowserStack App Live
        if: inputs.upload_browserstack
        working-directory: ${{ github.workspace }}
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          APP_FILE: ${{ steps.locate.outputs.file }}
        run: |
          RESPONSE=$(curl -s -u "$BS_USER:$BS_KEY" -X POST "https://api-cloud.browserstack.com/app-live/upload" -F "file=@$APP_FILE")
          echo "BrowserStack response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('app_url',''))" 2>/dev/null || true)
          if [ -n "$APP_URL" ]; then
            echo "### BrowserStack App Live" >> "$GITHUB_STEP_SUMMARY"
            echo "App uploaded: \`$APP_URL\` — open App Live and pick a device to test." >> "$GITHUB_STEP_SUMMARY"
          fi

  dagger:
    name: Build (Dagger pipeline)
    if: inputs.pipeline == 'dagger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Dagger (debug)
        if: inputs.build_type == 'debug-apk'
        uses: dagger/dagger-for-github@v8
        with:
          version: "0.21.11"
          verb: call
          args: build-file --source=. --project-path=${{ inputs.project_path }} --build-type=${{ inputs.build_type }} export --path=openforge-app.apk
      - name: Build with Dagger (release, signed)
        if: inputs.build_type != 'debug-apk'
        uses: dagger/dagger-for-github@v8
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        with:
          version: "0.21.11"
          verb: call
          args: build-file --source=. --project-path=${{ inputs.project_path }} --build-type=${{ inputs.build_type }} --keystore=env:SIGNING_KEY_STORE_BASE64 --store-password=env:SIGNING_STORE_PASSWORD --key-alias=${{ secrets.SIGNING_KEY_ALIAS }} --key-password=env:SIGNING_KEY_PASSWORD export --path=openforge-app.${{ inputs.build_type == 'release-aab' && 'aab' || 'apk' }}
      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}
          path: openforge-app.*
          if-no-files-found: error
      - name: Upload to Google Play
        if: inputs.upload_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: openforge-app.${{ inputs.build_type == 'release-aab' && 'aab' || 'apk' }}
          track: ${{ inputs.play_track }}
          status: draft
      - name: Upload to BrowserStack App Live
        if: inputs.upload_browserstack
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          APP_FILE: openforge-app.${{ inputs.build_type == 'release-aab' && 'aab' || 'apk' }}
        run: |
          RESPONSE=$(curl -s -u "$BS_USER:$BS_KEY" -X POST "https://api-cloud.browserstack.com/app-live/upload" -F "file=@$APP_FILE")
          echo "BrowserStack response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('app_url',''))" 2>/dev/null || true)
          if [ -n "$APP_URL" ]; then
            echo "### BrowserStack App Live" >> "$GITHUB_STEP_SUMMARY"
            echo "App uploaded: \`$APP_URL\` — open App Live and pick a device to test." >> "$GITHUB_STEP_SUMMARY"
          fi
